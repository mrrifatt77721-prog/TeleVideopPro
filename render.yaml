# Render Blueprint: one web service serves both the API and the built client.
services:
  - type: web
    name: televideo-pro
    runtime: node
    plan: free
    buildCommand: node setup.mjs && npm --prefix server install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI        # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: SMTP_HOST        # needed so users actually receive OTP emails
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BOT_TOKEN        # optional: real Telegram channel checks
        sync: false
